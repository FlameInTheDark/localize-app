<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#181818" />
    <title>Localize — AI Translation</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      try { if (localStorage.getItem("localize-theme") === "dark" || (!localStorage.getItem("localize-theme") && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("dark") } catch (_) {}
    </script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
